name: FortunetellingDebugApp
options:
  bundleIdPrefix: jp.dsgarage
  createIntermediateGroups: true
  deploymentTarget:
    iOS: 17.0
    watchOS: 10.0
  postGenCommand: pod install

settings:
  base:
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    DEVELOPMENT_TEAM: TNU5GR62GT
    CODE_SIGN_STYLE: Manual
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

targets:
  FortunetellingDebugApp:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: iOS/FortunetellingDebugApp
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.dsgarage.fortunetellingdebugapp
        INFOPLIST_FILE: iOS/FortunetellingDebugApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: iOS/FortunetellingDebugApp/FortunetellingDebugApp.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: ""
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "FortuneTellingDebugApp App Store"
    dependencies:
      - target: FortunetellingDebugWatch
        embed: true
        codeSign: true
      - target: FortunetellingDebugWatchExtension
        embed: false
    preBuildScripts:
      - script: |
          if [ ! -f "${SRCROOT}/iOS/FortunetellingDebugApp/Config.xcconfig" ]; then
            echo "// Auto-generated config" > "${SRCROOT}/iOS/FortunetellingDebugApp/Config.xcconfig"
          fi
        name: Generate Config
        inputFiles:
          - "${SRCROOT}/iOS/FortunetellingDebugApp/Config.xcconfig"
    postBuildScripts:
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        name: Run SwiftLint
        runOnlyWhenInstalling: false

  FortunetellingDebugWatch:
    type: application
    platform: watchOS
    deploymentTarget: 10.0
    sources:
      - path: watchOS/FortunetellingDebugWatch
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.dsgarage.fortunetellingdebugapp.watchkitapp
        INFOPLIST_FILE: watchOS/FortunetellingDebugWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          CODE_SIGN_STYLE: Manual
    dependencies:
      - target: FortunetellingDebugWatchExtension
        embed: true
        codeSign: true

  FortunetellingDebugWatchExtension:
    type: app-extension
    platform: watchOS
    deploymentTarget: 10.0
    sources:
      - path: watchOS/FortunetellingDebugWatchExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.dsgarage.fortunetellingdebugapp.watchkitapp.extension
        INFOPLIST_FILE: watchOS/FortunetellingDebugWatchExtension/Info.plist
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          CODE_SIGN_STYLE: Manual

schemes:
  FortunetellingDebugApp:
    build:
      targets:
        FortunetellingDebugApp: all
        FortunetellingDebugWatch: all
        FortunetellingDebugWatchExtension: all
    run:
      config: Debug
      commandLineArguments:
        "-FIRAnalyticsDebugEnabled": true
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - FortunetellingDebugApp
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true