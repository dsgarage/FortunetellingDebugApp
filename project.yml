name: FortunetellingDebugApp
options:
  bundleIdPrefix: jp.dsgarage
  createIntermediateGroups: true
  deploymentTarget:
    iOS: 17.0
    watchOS: 10.0
  postGenCommand: pod install

settings:
  base:
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    DEVELOPMENT_TEAM: TNU5GR62GT
    CODE_SIGN_STYLE: Manual
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

targets:
  FortunetellingDebugApp:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: iOS/FortunetellingDebugApp
        excludes:
          - "**/*.md"
          - "Info.plist"
    resources:
      - path: iOS/FortunetellingDebugApp/Assets.xcassets
      - path: iOS/FortunetellingDebugApp/LaunchScreen.storyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.dsgarage.fortunetellingdebugapp
        INFOPLIST_FILE: iOS/FortunetellingDebugApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: iOS/FortunetellingDebugApp/FortunetellingDebugApp.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: ""
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "FortuneTellingDebugApp App Store"
    dependencies: []
      # - target: FortunetellingDebugWatchApp
      #   embed: true
      #   codeSign: true
    preBuildScripts:
      - script: |
          if [ ! -f "${SRCROOT}/iOS/FortunetellingDebugApp/Config.xcconfig" ]; then
            echo "// Auto-generated config" > "${SRCROOT}/iOS/FortunetellingDebugApp/Config.xcconfig"
          fi
        name: Generate Config
        inputFiles:
          - "${SRCROOT}/iOS/FortunetellingDebugApp/Config.xcconfig"
    postBuildScripts:
      - script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
          fi
        name: Run SwiftLint
        runOnlyWhenInstalling: false

  FortunetellingDebugWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: 10.5
    sources:
      - path: watchOS/FortunetellingDebugWatchApp
        excludes:
          - "Info.plist"
    resources:
      - path: watchOS/FortunetellingDebugWatch/Assets.xcassets
    info:
      path: watchOS/FortunetellingDebugWatchApp/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: jp.dsgarage.fortunetellingdebugapp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.dsgarage.fortunetellingdebugapp.watchkitapp
        INFOPLIST_FILE: watchOS/FortunetellingDebugWatchApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: 5.0
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: TNU5GR62GT
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: TNU5GR62GT

schemes:
  FortunetellingDebugApp-iOS:
    build:
      targets:
        FortunetellingDebugApp: all
        FortunetellingDebugWatchApp: all
    run:
      config: Debug
      commandLineArguments:
        "-FIRAnalyticsDebugEnabled": true
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - FortunetellingDebugApp
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
  
  FortunetellingDebugWatchApp:
    build:
      targets:
        FortunetellingDebugWatchApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release